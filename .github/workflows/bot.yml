name: Daily Discord Bot Run

on:
  schedule:
    # S'exécute automatiquement tous les jours à 10:00 UTC (soit 12:00 heure française)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permet de déclencher l'envoi manuellement quand vous voulez

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install discord.py

      - name: Run Bot Command
        run: python bot.py
